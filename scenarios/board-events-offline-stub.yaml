# Офлайн-заглушка (app/agent/stub.py, json_completion) не знала ветки под
# BOARD_EVENTS_SYSTEM: любая запись на доску со словарём величин уходила в
# generic-ответ без «events», а extract_events() трактует пустой список как
# «величин не найдено» — не как отказ, так что предупреждения не было нигде.
# В обычном офлайн-режиме (LLM_STUB=1, тем самым, которым по умолчанию поднят
# стенд) статистика ЛЮБОЙ доски со словарём молча показывала бы ноль всегда.
#
# Сценарий намеренно не подставляет `model: json:` — это и есть разница с
# board-stats.yaml, который всегда скриптует ответ и поэтому эту находку
# не ловит: здесь запись разбирает настоящая офлайн-заглушка.
name: Офлайн-заглушка разбирает запись доски на величины
user: marina
reset:
  autonomy: 3

steps:
  - name: заводим словарь величин для «Счётчики»
    post: /memory/boards/1/types/add
    data: {name: "вода", unit: "л"}
    expect:
      status: 303

  - name: обычная запись без режиссёра модели
    post: /memory/entries/add
    data: {board_id: "1", text: "вода 456"}
    expect:
      status: 303

  - name: величина разобралась настоящей офлайн-заглушкой
    open: /memory?section=1&board=1
    expect:
      status: 200
      rows:
        - {table: board_events, min: 1, contains: "вода"}
