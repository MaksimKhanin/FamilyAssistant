# Карточка события (app/templates/security/events.html) всегда писала «Это
# оценка модели, а не факт» — даже когда классифицировало сито (детерминированная
# ступень по времени и зоне, SecurityEvent.classified_by == "rules"), а не модель.
# Большинство аномалий никогда не доезжают до модели — это как раз тот случай.
# Строка про push-уведомление тоже была безусловной, хотя реально уходит оно
# только когда `notified_at` заполнен.
name: Карточка события не приписывает модели решение сита
user: marina
reset:
  autonomy: 3

steps:
  - name: демо-аномалия классифицирована ситом, не моделью
    open: /security/events?event_id=1
    expect:
      status: 200
      text_contains: "решило сито"
      text_not_contains: ["оценка модели", "уведомление на телефоне"]
