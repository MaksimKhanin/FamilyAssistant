# Экран архива предлагал чистку только фиксированными периодами (сутки,
# двое суток, неделя, месяц) — свободное число дней доступно из чата через
# clear_archive/older_than_days, но с экрана его было не набрать. Ручка
# /security/archive/purge (тот же сервисный код retention.purge, что и
# готовые периоды и тул) уже принимает произвольное число — не хватало поля
# ввода на archive.html, чтобы им воспользоваться.
name: Своё число дней на экране архива
user: marina
reset:
  autonomy: 3

steps:
  - name: на экране архива есть поле для своего числа дней, а не только готовые кнопки
    open: /security/archive
    expect:
      status: 200
      text_contains: "своё число дней"

  - name: своё число дней, не входящее в готовые периоды, проходит той же ручкой
    post: /security/archive/purge
    data: {older_than: 45}
    expect:
      status: 303
      location_contains: "notice"
