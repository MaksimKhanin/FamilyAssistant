# Напоминания: сказанное время наступает, и ассистент это произносит.
#
# Проверка расписания без ожидания: минута расписаний прогоняется ручкой с
# явным временем, а результат ищется не на экране, а в том, что ассистент
# сказал сам, — в событиях шины, из которых растут push-уведомления.
name: Напоминание срабатывает
user: marina
reset:
  autonomy: 3

steps:
  - name: наступившее напоминание уходит человеку
    tick: true
    expect:
      messages_contain: "выпить лекарство"

  - name: ассистент завёл новое напоминание
    tool: set_reminder
    arguments: {text: "позвонить врачу", at: "2026-12-31 09:00"}

  - name: экран напоминаний открывается
    open: /reminders
    expect:
      status: 200

  - name: заведённое напоминание попало в базу
    state: true
    tables: reminders
    expect:
      rows:
        - {table: reminders, min: 2, contains: "позвонить врачу"}
