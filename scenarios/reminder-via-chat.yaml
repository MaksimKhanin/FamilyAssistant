# Самая естественная русская фраза для напоминания — «напомни ...» — а офлайн-
# разбор (app/agent/stub.py, таблица KEYWORDS) вообще не знает инструмента
# set_reminder: слово «напомни» отдано исключительно `remember`. В результате
# человек, попросивший напомнить о враче завтра в 9 утра, получает не
# запланированное напоминание, а молчаливо осевший факт на доске «Память
# ассистента» — automat не запустит push, и «напоминание» никогда не придёт.
#
# У реальной модели этой путаницы нет: описание инструмента `remember` прямо
# говорит «для напоминаний со сроком — set_reminder» (app/modules/memory/tools.py).
# Воспроизводится только в офлайн-режиме (LLM_STUB=1) — тем самым, которым по
# умолчанию поднят стенд для проверок без ключа.
name: «Напомни» через чат заводит настоящее напоминание, а не заметку
user: marina
reset:
  autonomy: 3

steps:
  - name: «напомни завтра в 9 утра сходить к врачу» должно вызвать set_reminder
    say: "напомни завтра в 9 утра сходить к врачу"
    expect:
      tool: set_reminder
      rows:
        - {table: reminders, min: 1, contains: "врачу"}
