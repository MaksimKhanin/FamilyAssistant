# Офлайн-заглушка при нескольких типах в словаре всегда угадывала первый по
# списку — независимо от того, что реально написано в записи. «кофе 2 чашки»
# на доске со словарём «вода, кофе» разбиралась как «вода», и плашка
# уточнения предлагала этот неверный угаданный тип первой кнопкой (UX-находка).
name: Угаданный тип величины совпадает с тем, что названо в записи
user: marina
reset:
  autonomy: 3

steps:
  - name: заводим второй тип, чтобы «вода» перестала быть единственной
    post: /memory/boards/1/types/add
    data: {name: "кофе", unit: "чашка"}
    expect:
      status: 303

  - name: запись про кофе, а не про воду — воду завели первой
    post: /memory/entries/add
    data: {board_id: 1, text: "кофе 2 чашки"}
    expect:
      status: 303
      rows:
        - {table: board_events, min: 1, contains: "кофе", not_contains: "вода"}
