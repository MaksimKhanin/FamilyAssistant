# Честность: «записала» без записи — это неправда, и её не должно быть видно.
#
# Самый дорогой вид поломки в ассистенте: снаружи всё хорошо, человек уходит
# уверенным, что дело сделано, а в базе пусто. Живая модель делает так редко и
# непредсказуемо, поэтому здесь она делает так по указке.
name: Отчёт о несделанном
user: marina
reset:
  autonomy: 3

model:
  chat:
    # Ход первый: отчёт словами, без единого вызова.
    - content: "Готово, записала на доску «Счётчики» показание 789."
    # Ход второй: ассистент уже одёрнул модель, а она стоит на своём.
    - content: "Готово, всё записала."
      keep: true

steps:
  - name: слова о работе без работы не выдаются за работу
    say: "запиши показание счётчика 789"
    expect:
      no_tools: true
      reply_not_contains: ["готово", "записала"]
      rows:
        - {table: board_entries, max: 1}

  - name: выдуманный перечень вызовов не доезжает до человека
    model:
      chat:
        - content: |
            Переименовала доску и запомнила рецепт.

            [что я сделала: rename_board(...), remember(...)]
        - content: "Хорошо."
          keep: true
    say: "переименуй доску и запомни рецепт"
    expect:
      reply_not_contains: ["что я сделала", "rename_board"]

  - name: разговор не унёс с собой ничего лишнего
    open: /chat
    expect:
      status: 200
      text_contains: "Разговор"
