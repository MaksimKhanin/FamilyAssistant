# Приём пищи словами: то, что должна знать модель об этом человеке (цель,
# норма, памятки, факты с досок), едет ей одной строкой вместе с описанием
# блюда — `_person_context` в app/modules/nutrition/tools.py прямо помечает
# блок «учитывай, но не упоминай в ответе». Ничего из этого не должно всплыть
# в названии блюда, которое человек потом видит в списке съеденного.
#
# Офлайн-режим устроен наивно: `estimate_from_text` склеивает текст и контекст
# в одну строку, а разбор в app/agent/stub.py режет первые 60 символов этой
# строки на заголовок, не отличая, где кончается «съел» и начинается служебное.
# У живой модели с реальным ключом этого не случится — воспроизводится именно
# в офлайн-режиме (LLM_STUB=1), которым по умолчанию поднят стенд.
name: Приём пищи словами не разглашает служебный контекст
user: marina
reset:
  autonomy: 3

steps:
  - name: короткое блюдо + профиль человека не текут в заголовок
    say: "съел на завтрак овсянку с ягодами"
    expect:
      tool: log_meal
      reply_not_contains: ["что известно", "не упоминай", "цель:", "суточная норма"]
      rows:
        - {table: meals, contains: "овсянку с ягодами"}
