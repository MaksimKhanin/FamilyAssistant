# Значок «События» в навигации (app/web/context.py, badges()) считал только
# сегодняшние тревоги (anomaly_count(days=1)), а сам экран событий — за
# FEED_DAYS=7 суток (unseen_count, app/modules/security/service.py — с прямым
# комментарием, что цифры обязаны сходиться). Демо-семья заводит одну
# непросмотренную ночную аномалию «вчера ночью» (run_local.py, _seed_home):
# она уже не «сегодня», но ещё «на этой неделе» — значок гас, экран под ним
# показывал «Непросмотренных — 1».
name: Значок «События» видит то же окно, что и сам экран
user: marina
reset:
  autonomy: 3

steps:
  - name: значок в навигации видит вчерашнюю аномалию
    open: /
    expect:
      status: 200
      text_contains: "События 1"

  - name: экран событий согласен с тем же числом
    open: /security/events
    expect:
      status: 200
      text_contains: "Непросмотренных — 1"
