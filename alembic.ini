# Alembic: numbered schema migrations (see docs/deployment.md).
#
# The database URL is deliberately absent: env.py takes the application's
# DATABASE_URL, so `alembic upgrade head` hits the same database as the server.
#
# ASCII only, no Cyrillic: alembic reads this file with configparser using the
# OS locale encoding, so on a Russian Windows (cp1251) any UTF-8 comment here
# blows up with UnicodeDecodeError before a single migration runs.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Filenames: <number>_<slug>.py - the order is visible in the directory listing.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
