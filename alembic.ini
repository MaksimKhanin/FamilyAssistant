# Alembic: пронумерованные миграции схемы (см. docs/deployment.md).
#
# Адрес базы сюда не пишется: env.py берёт DATABASE_URL приложения, так что
# `alembic upgrade head` работает с той же базой, что и сам сервер.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Имена файлов: <номер>_<слаг>.py — порядок виден прямо в листинге каталога.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
