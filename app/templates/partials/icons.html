{# Line icons, 24×24, stroke currentColor — replaceable by the project's icon set. #}
{% macro icon(name, size=17) -%}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" stroke="currentColor"
     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == "grid" -%}
    <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
    <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
  {%- elif name == "note" -%}
    <path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 16h5"/>
  {%- elif name == "plus" -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == "chart" -%}
    <path d="M5 20V10M12 20V4M19 20v-7"/>
  {%- elif name == "pulse" -%}
    <path d="M3 12h4l2-6 4 12 2-6h6"/>
  {%- elif name == "book" -%}
    <path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17h14"/>
  {%- elif name == "shield" -%}
    <path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/>
  {%- elif name == "camera" -%}
    <rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 11l6-3v8l-6-3z"/>
  {%- elif name == "plug" -%}
    <path d="M9 3v6M15 3v6"/><path d="M6 9h12v3a6 6 0 0 1-12 0z"/><path d="M12 18v3"/>
  {%- elif name == "wand" -%}
    <path d="M15 4l5 5L9 20l-5 1 1-5z"/><path d="M13 6l5 5"/>
  {%- elif name == "users" -%}
    <circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5a3 3 0 0 1 0 6"/>
    <path d="M17.5 14a6 6 0 0 1 3.5 5.5"/>
  {%- elif name == "user" -%}
    <circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>
  {%- elif name == "brain" -%}
    <path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-1 5.5A3 3 0 0 0 8 18a3 3 0 0 0 4 2V4z"/>
    <path d="M15 4a3 3 0 0 1 3 3 3 3 0 0 1 1 5.5A3 3 0 0 1 16 18a3 3 0 0 1-4 2"/>
  {%- elif name == "chat" -%}
    <path d="M20 12a8 8 0 1 1-3.2-6.4"/><path d="M20 4v5h-5"/>
  {%- elif name == "check" -%}
    <path d="M5 13l4 4 10-10"/>
  {%- elif name == "close" -%}
    <path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == "send" -%}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>
  {%- else -%}
    <circle cx="12" cy="12" r="3"/>
  {%- endif -%}
</svg>
{%- endmacro %}
